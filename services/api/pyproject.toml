[project]
name = "oxane-onboarding-api"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.16",
  "anthropic>=0.75",
  "fastapi>=0.115",
  "openpyxl>=3.1",
  "pillow>=11.0",
  "psycopg[binary]>=3.2",
  "pypdfium2>=4.30",
  "pydantic-settings>=2.6",
  "pyyaml>=6.0",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.pipeline"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
