  - {id: kingsbury, name: Kingsbury Motor Credit Warehouse LLC, deal_type: Auto warehouse, file: Kingsbury_Tape_2026-04.csv}
  - {id: redfern, name: Redfern Auto Receivables 2025-W LLC, deal_type: Auto warehouse, file: Redfern_Tape_2026-04.csv}
  - {id: whitcombe, name: Whitcombe Auto Trust 2024-2, deal_type: Auto term securitisation, file: Whitcombe_Tape_2026-04.csv}

