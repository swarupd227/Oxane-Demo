# What a client may ask to be alerted on, by facility. Thornbury's facility is not here: its
# data never goes to a model.
alert_metrics:
  bramble.delinquency_60_plus: {label: "Bramble 60+ day delinquency", unit: "%", range: [0, 100], concept: delinquency_trigger}
  bramble.availability_usd: {label: Bramble availability, unit: US$, range: [-1000000000, 1000000000], concept: availability}
  bramble.leverage_ratio: {label: Bramble leverage ratio, unit: x, range: [0, 50], concept: leverage_ratio}
  northmoor.delinquency_60_plus: {label: "Northmoor 60+ day delinquency", unit: "%", range: [0, 100], concept: delinquency_trigger}
  northmoor.excess_spread: {label: Northmoor excess spread, unit: "%", range: [-50, 50], concept: trigger}
  kestrel.loan_to_value: {label: Kestrel loan-to-value, unit: "%", range: [0, 100], concept: loan_to_value}
  kestrel.ltv_headroom_pts: {label: Kestrel loan-to-value headroom, unit: points, range: [-100, 100], concept: loan_to_value}
alert_presets:
  - "Tell me if Northmoor's 60+ day delinquency goes above 5.5%."
  - "Warn me when Kestrel's loan-to-value comes within 5 points of its limit."
  - "Alert me if Bramble's availability drops below US$5 million."

# Stated assumptions for the scorecard, to be replaced by measured baselines in discovery.
assumptions:
  baseline_hours_per_cycle: {bramble: 7.5, northmoor: 6.0, kestrel: 4.0, larkspur: 5.0, ravenglass: 18.0, wharfedale: 6.0}
  baseline_turnaround_business_days: 3
  analyst_hours_per_month: 140
  review_hours_per_finding: 0.5
  review_hours_per_facility: 2.0
  source: "Assumed for illustration. Oxane has not shared a baseline; discovery measures it per mandate."
