    - {number: "0419", client: Northgate Capital Partners, facility: Cobalt Equipment and SME Finance II, deal_type: SME loans, stage: Intake, limit_usd: 110000000, opened: 2026-05-13, stage_entered: 2026-05-13, owner: TL}
    - {number: "0421", client: Calderwood Bank plc, facility: Harrowgate Auto Lease Funding, deal_type: Auto ABF, stage: Intake, limit_usd: 200000000, opened: 2026-05-14, stage_entered: 2026-05-14, owner: RK}
  # The backbook deals load as cases of their own under Calderwood; the API fills their
