# The platform's standard data model. Each master field feeds one entity; the fields that
# stratify a pool are listed apart.
standard_model:
  entities:
    loan: Loan-level record, one row per receivable or position
    facility: Facility record and its terms
    portfolio: Pool and portfolio totals
    test: Test inputs and results
    stratification: Buckets that split the pool
  stratification: [obligor_state, dealer_name, dealer_state, vehicle_make, vehicle_condition, days_past_due,
                   industry, moodys, sp, employment_type, sector, sponsor, facility_type, investor_type,
                   rating, designation]
  portfolio: [cutoff_date, servicer_code, financials_as_of]
  test: [current_balance, charge_off_amount, status, par, bid, outstanding, ebitda, ebitda_adjustments,
         covenant_ebitda, net_debt, interest_expense, uncalled, commitment, called, advance_rate]

