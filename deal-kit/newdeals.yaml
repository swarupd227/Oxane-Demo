  seed: 7311
  deal_type: Consumer instalment
  lender: {name: Ashgrove Capital Partners LP, short: Ashgrove, address: "400 Park Row, Suite 2100, Chicago, IL 60601"}
  borrower: {name: Harbourline Consumer Receivables LLC, short: Harbourline, address: "88 Quay Street, Baltimore, MD 21202"}
  parent: Harbourline Finance Inc.
  servicer: Harbourline Servicing LLC
  governing_law: State of Illinois
  signing_date: 2026-03-16
  commitment_usd: 150000000
  advance_rate_pct: "88.00"
  reserve_pct: "1.50"
  margin: "SOFR plus 3.40% per annum"
  revolving_period_end: 2028-03-15
  final_maturity: 2029-09-15
  report_day: 15
  amendment:
    signed: 2026-08-20
    effective: 2026-09-01
    advance_rate_pct: "86.00"
    new_concentration: {text: "Receivables financing Home Improvement products", limit_pct: "20.00"}
