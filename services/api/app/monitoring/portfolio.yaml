# The platform's facility record for the monitoring desk: its clients, what was set up when each
# facility was onboarded, and the inbox log of what arrived this cycle.
# Bramble's terms, rules and tape mapping come from its onboarding run, so they are not repeated.
# The monitoring pipeline reads this file. It never reads the cycle answer key.

lender: Calderwood Bank plc
desk: Monitoring desk
# Each client's own policy. Data, mapping memory and model use never cross from one client to
# another. A client that does not permit AI stays on the existing process: code checks only.
clients:
  - id: calderwood
    name: Calderwood Bank plc
    ai_permitted: true
    contact: {name: Priya Raman, role: Named contact, Oxane monitoring}
    client_contact: {name: James Whitcombe, role: Director, warehouse and fund finance}
    status_call: Tuesdays 10:00, 20 minutes
    approval_levels:
      - {level: 1, actor: analyst, title: Preparer}
      - {level: 2, actor: approver, title: Second analyst}
    # Where Calderwood agreed, last period's data is reused if a routine file is not resent.
    reuse_consent: "Calderwood Bank, email of 12 Feb 2026: reuse last month's dealer list if it is not resent"
  - id: thornbury
    name: Thornbury Bank N.A.
    ai_permitted: false
    ai_note: Thornbury's data agreement does not permit AI processing, so its facility stays on the existing process.
    contact: {name: Daniel Okafor, role: Named contact, Oxane monitoring}
    client_contact: {name: Laura Haskett, role: Head of leveraged finance portfolio}
    status_call: Thursdays 15:00, 15 minutes
    approval_levels:
      - {level: 1, actor: analyst, title: Preparer}
      - {level: 2, actor: approver, title: Second analyst}
      - {level: 3, actor: senior, title: Head of monitoring}
    # Thornbury's master field for ratings: the lower of Moody's and S&P. The platform default
    # is Moody's alone.
    master_field_overrides:
      - {field: rating_for_tests, default: moodys, override: lower_of,
         reason: "Thornbury reads ratings as the lower of Moody's and S&P, as its agreements do"}
# The desk's people, by the role each acts as. The workbench shows the acting user.
team:
  analyst: {name: Priya Raman, title: Monitoring analyst}
  approver: {name: Marcus Hale, title: Second analyst}
  senior: {name: Elena Varga, title: Head of monitoring}
  client: {name: James Whitcombe, title: "Director, Calderwood Bank"}
cycle:
  id: "M-2026-05"
  label: May 2026
  period_end: 2026-05-31
  # The demo runs as of this date, so the late file and its chase are fixed in time.
  as_of: 2026-06-24
tolerances:
  certificate_usd: 50
  roll_forward_usd: 50
  # A trigger within this many percentage points of its limit is an early warning.
  trigger_warning_pts: 0.5

