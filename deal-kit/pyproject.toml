[project]
name = "oxane-deal-kit"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "numpy>=2.1",
  "openpyxl>=3.1",
  "pdfplumber>=0.11",
  "pillow>=11.0",
  "pydantic>=2.9",
  "pypdfium2>=4.30",
  "pyyaml>=6.0",
  "reportlab>=4.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["dealkit"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
