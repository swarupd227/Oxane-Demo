    - {initials: RK, name: Rohan Kapoor}
    - {initials: SN, name: Sana Naqvi}
    - {initials: DB, name: Dev Bhatia}
    - {initials: TL, name: Tom Lister}
  cases:
    - {number: "0371", client: Calderwood Bank plc, facility: Northmoor Motor Credit Trust, deal_type: Auto ABF, stage: Live, limit_usd: 180000000, opened: 2025-11-03, stage_entered: 2026-01-12, owner: RK}
    - {number: "0384", client: Calderwood Bank plc, facility: Kestrel Credit Fund III, deal_type: Fund finance, stage: Live, limit_usd: 120000000, opened: 2025-12-08, stage_entered: 2026-02-02, owner: SN}
    - {number: "0390", client: Thornbury Bank N.A., facility: Larkspur CLO 2026-1 Warehouse, deal_type: CLO warehouse, stage: Live, limit_usd: 400000000, opened: 2026-01-19, stage_entered: 2026-03-16, owner: DB}
    - {number: "0403", client: Marlow Fund Finance LLP, facility: Granite Peak Fund IV subscription line, deal_type: Fund finance, stage: QC, limit_usd: 75000000, opened: 2026-03-23, stage_entered: 2026-05-11, owner: SN}
    - {number: "0406", client: Halden Bank AG, facility: Ferncliff Consumer Loans 2026-1, deal_type: Consumer instalment, stage: Clarification, limit_usd: 150000000, opened: 2026-04-01, stage_entered: 2026-04-27, owner: AM}
    - {number: "0408", client: Thornbury Bank N.A., facility: Larkspur CLO 2026-2 Warehouse, deal_type: CLO warehouse, stage: Interpretation, limit_usd: 350000000, opened: 2026-04-14, stage_entered: 2026-05-06, owner: DB}
