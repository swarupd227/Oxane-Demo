# Thornbury Bank's CLO warehouse, a second client of the desk. Thornbury does not permit AI on its
# data, so this facility runs on code checks only. Files arrive as structured data: the
# collateral administrator's positions workbook by SFTP and the pricing service's file by API.
larkspur:
  name: Larkspur CLO 2026-1 Warehouse
  borrower: Larkspur CLO 2026-1 Warehouse Ltd
  manager: Larkspur Credit Management LLC
  administrator: Halden Trust Company N.A.
  pricing_service: Meridian Loan Pricing
  lender: Thornbury Bank N.A.
  type: CLO warehouse facility
  signed: 2026-02-10
  commitment_usd: 400000000
  drawn_usd: 290000000
  advance_rate_pct: 70
  ccc_limit_pct: 7.5
  price_move_alert_pts: 10
  positions: 60
  april_date: 2026-04-30
  may_date: 2026-05-29
  # Positions with set ratings and prices. Every other position is generated from the seed.
  # [issuer, Moody's, S&P, par, April bid, May bid]
  ccc_in_april:
    - [Muker Telecom, Caa1, CCC+, 8000000, 84.00, 83.75]
    - [Embsay Fitness, Caa2, CCC, 7000000, 72.50, 71.25]
    - [Stainforth Specialty Retail, Caa1, B-, 9000000, 86.25, 86.00]
    # CCC under the lower-of rule only: S&P rates it CCC+.
    - [Gunnerside Media, B3, CCC+, 7000000, 87.75, 88.00]
  planted:
    # M11: downgraded in May; the CCC bucket goes over its limit and the excess is haircut.
    downgrade: {issuer: Kettlewell Auto Parts, par: 7500000, april: [B3, B-], may: [Caa2, CCC], bid: [88.00, 79.50]}
    # M12: the price falls more than 10 points in the month with no rating change.
    price_drop: {issuer: Denholme Chemicals, par: 8500000, rating: [B2, B], bid: [96.25, 81.50]}
    # N5: the agent consolidated an incremental term loan into this tranche, so it has new
    # identifiers. Issuer, facility, maturity and spread are unchanged.
    identifier_change: {issuer: Langdale Education, par: 9500000, old: [LX301245, 51475HAB3], new: [LX318806, 51475HAD9]}
    # No S&P rating: a reference-data warning, not an error.
    not_rated: Wensley Security Services
    sold: Hawes Hotels
    bought: [[Oxenhope Pet Care, 7000000, 99.25], [Reeth Payments, 7000000, 99.50]]
  received:
    positions_april: 2026-05-12
    prices_april: 2026-04-30
    positions_may: 2026-06-12
    prices_may: 2026-05-29

