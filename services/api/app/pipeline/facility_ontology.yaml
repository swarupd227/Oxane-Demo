# Artizent's Facility Ontology for asset-based finance: the concepts an onboarding analyst works with,
# what each one means, what form its value takes, and how the concepts relate.
# The model is grounded in it, and code checks every answer against it.
# `fields` are the facility terms a concept governs, and `tape_fields` the platform fields.
# Kinds: money, percent, ratio, count, date, text, list.
version: "1.0"
concepts:
  # The facility and how much can be lent
  - id: facility_limit
    label: Facility limit
    kind: money
    meaning: The most the lender has committed to lend under the facility.
    fields: [Facility limit]
    relations:
      - {type: caps, target: availability}
  - id: advance_rate
    label: Advance rate
    kind: percent
    meaning: The share of the eligible pool, after excess concentration, that the lender will advance.
    fields: [Advance rate]
    relations:
      - {type: applies to, target: eligible_pool}
      - {type: can be changed by, target: amendment}
  - id: eligible_pool
    label: Eligible pool
    kind: money
    meaning: The total outstanding balance of the receivables that pass every eligibility criterion.
    relations:
      - {type: made up of, target: receivable}
      - {type: reduced by, target: excess_concentration}
  - id: eligibility_criterion
    label: Eligibility criterion
    kind: count
    meaning: A test every receivable must pass. A receivable that fails any test is excluded in full.
    fields: [Eligibility criteria]
    relations:
      - {type: tests, target: receivable}
      - {type: decides, target: eligible_pool}
  - id: concentration_limit
    label: Concentration limit
    kind: count
    meaning: The most of the eligible pool that one group of receivables may make up, such as one dealer or one state.
    fields: [Concentration limits]
    relations:
      - {type: measured against, target: eligible_pool}
      - {type: produces, target: excess_concentration}
  - id: excess_concentration
    label: Excess concentration
    kind: text
    meaning: The amount by which a group of receivables exceeds its concentration limit.
    fields: [Excess concentration treatment]
    relations:
      - {type: deducted from, target: eligible_pool}
      - {type: deducted before, target: advance_rate}
  - id: reserve
    label: Reserve
    kind: percent
    meaning: An amount held back from the borrowing base, set as a share of the eligible pool.
    fields: [Reserve amount]
    relations:
      - {type: deducted from, target: borrowing_base}
  - id: borrowing_base
    label: Borrowing base
    kind: money
    meaning: The eligible pool less excess concentration, times the advance rate, less the reserve.
    relations:
      - {type: calculated from, target: eligible_pool}
      - {type: calculated from, target: advance_rate}
      - {type: verified against, target: borrowing_base_certificate}
  - id: availability
    label: Availability
    kind: money
    meaning: The borrowing base, capped at the facility limit, less the advances outstanding.
    relations:
      - {type: watched by, target: alert_threshold}
  - id: borrowing_base_certificate
    label: Borrowing base certificate
    kind: text
    meaning: The borrower's own monthly calculation of the borrowing base, which the lender verifies.
    relations:
      - {type: reports, target: borrowing_base}

  # Tests on the borrower and the pool
  - id: delinquency_trigger
    label: Delinquency trigger
    kind: percent
    meaning: A pool test on the share of receivables past due. A breach stops new advances.
    fields: [Delinquency trigger]
    relations:
      - {type: measured by, target: days_past_due}
  - id: tangible_net_worth_covenant
    label: Tangible net worth covenant
    kind: money
    meaning: The least tangible net worth the borrower's parent must keep.
    fields: [Minimum tangible net worth covenant]
  - id: leverage_covenant
    label: Leverage covenant
    kind: ratio
    meaning: The highest leverage ratio the borrower's parent may reach.
    fields: [Maximum leverage covenant]
    relations:
      - {type: tests, target: leverage_ratio}
  - id: leverage_ratio
    label: Leverage ratio
    kind: ratio
    meaning: Total liabilities, less permitted subordinated debt, divided by tangible net worth.
  - id: liquidity_covenant
    label: Liquidity covenant
    kind: money
    meaning: The least unrestricted cash the borrower's parent must hold.
    fields: [Minimum liquidity covenant]
  - id: restricted_jurisdiction
    label: Restricted jurisdiction
    kind: list
    meaning: A place where an obligor's billing address makes the receivable ineligible.
    fields: [Restricted jurisdictions]
    relations:
      - {type: tested by, target: eligibility_criterion}
      - {type: applies to, target: obligor}
  - id: event_of_default
    label: Event of default
    kind: count
    meaning: An event that lets the lender stop lending and demand repayment.
    fields: [Event of default list]
  - id: alert_threshold
    label: Alert threshold
    kind: count
    meaning: A level the lender asks to be told about, such as availability falling below a set amount.
    fields: [Lender alert thresholds]
    relations:
      - {type: watches, target: availability}

  # Pricing, timing and parties
  - id: margin
    label: Margin
    kind: percent
    meaning: The interest the borrower pays over the benchmark rate, Term SOFR.
    fields: [Margin]
  - id: unused_fee
    label: Unused fee
    kind: percent
    meaning: A yearly fee on the part of the facility limit that is not drawn.
    fields: [Unused fee]
    relations:
      - {type: charged on, target: facility_limit}
  - id: interest_period
    label: Interest period
    kind: text
    meaning: How long each interest period runs, and the day interest is paid.
    fields: [Interest period and payment date]
  - id: reporting_obligation
    label: Reporting obligation
    kind: text
    meaning: What the borrower must deliver to the lender, and by when.
    fields: [Borrowing base reporting date, Financial statement reporting]
    relations:
      - {type: includes, target: borrowing_base_certificate}
  - id: revolving_period
    label: Revolving period
    kind: date
    meaning: The period in which the borrower may draw and repay. New advances stop at its end.
    fields: [Revolving period end]
  - id: final_maturity
    label: Final maturity
    kind: date
    meaning: The date by which every advance must be repaid.
    fields: [Final maturity]
  - id: party
    label: Party
    kind: text
    meaning: A person or company named in the agreement, with its role and notice address.
    fields: ["Borrower, parent and servicer names", Lender and agent names, Notice addresses]
  - id: governing_law
    label: Governing law
    kind: text
    meaning: The law under which the agreement is read and enforced.
    fields: [Governing law]
  - id: agreement_date
    label: Agreement date
    kind: date
    meaning: The date the agreement was signed.
    fields: [Signing date]
  - id: amendment
    label: Amendment
    kind: text
    meaning: A signed change to the agreement. It applies from its effective date, not its signing date.
    fields: [Amendment dates]
    relations:
      - {type: changes, target: advance_rate}

  # The receivables on the loan tape
  - id: receivable
    label: Receivable
    kind: text
    meaning: One auto loan pledged to the facility, identified by its loan number.
    tape_fields: [loan_id, status, servicer_code, cutoff_date]
    relations:
      - {type: owed by, target: obligor}
      - {type: secured by, target: financed_vehicle}
      - {type: originated by, target: dealer}
  - id: outstanding_balance
    label: Outstanding balance
    kind: money
    meaning: The unpaid principal at the cut-off date. Eligibility and concentration are measured on it.
    tape_fields: [current_balance]
    relations:
      - {type: adds up to, target: eligible_pool}
  - id: loan_amount
    label: Loan amount
    kind: money
    meaning: What was lent and what is repaid each month.
    tape_fields: [original_balance, amount_financed, monthly_payment]
  - id: loan_term
    label: Loan term
    kind: count
    meaning: How many monthly payments the loan has in total, has had and has left.
    tape_fields: [original_term, remaining_term, payments_made]
  - id: loan_date
    label: Loan date
    kind: date
    meaning: A date in the life of a loan, from origination to the next payment due.
    tape_fields: [origination_date, first_payment_date, maturity_date, last_payment_date, next_due_date]
  - id: loan_modification
    label: Loan modification
    kind: count
    meaning: A change to a loan's terms after origination. Too many make a loan ineligible.
    tape_fields: [modification_count]
  - id: days_past_due
    label: Days past due
    kind: count
    meaning: How many days the oldest unpaid payment is overdue at the cut-off date.
    tape_fields: [days_past_due]
    relations:
      - {type: tested by, target: eligibility_criterion}
  - id: charge_off
    label: Charge-off
    kind: text
    meaning: A loan written off as uncollectable, or whose vehicle was repossessed. It is never eligible.
    tape_fields: [charge_off_date, charge_off_amount, repossession_date]
  - id: interest_rate
    label: Interest rate
    kind: percent
    meaning: The annual percentage rate the obligor pays on the loan.
    tape_fields: [apr]
  - id: credit_score
    label: Credit score
    kind: count
    meaning: The obligor's FICO score at origination.
    tape_fields: [fico]
  - id: obligor
    label: Obligor
    kind: text
    meaning: The person who owes the loan, with where they live and what they earn.
    tape_fields: [obligor_state, obligor_zip3, employment_type, stated_monthly_income, payment_to_income]
  - id: dealer
    label: Dealer
    kind: text
    meaning: The dealer that originated the loan. Variations of one dealer's name count as one dealer.
    tape_fields: [dealer_name, dealer_state]
    relations:
      - {type: grouped by, target: concentration_limit}
  - id: financed_vehicle
    label: Financed vehicle
    kind: text
    meaning: The car securing the loan. One VIN on two loans suggests the car was pledged twice.
    tape_fields: [vin, vehicle_make, vehicle_model, model_year, vehicle_condition,
                  odometer_at_origination, vehicle_book_value, loan_to_value]
    relations:
      - {type: secures, target: receivable}
