# Thornbury Bank's CLO warehouse, a second client of the desk. Thornbury does not permit AI on its
# data, so this facility runs on code checks only. Files arrive as structured data: the
# collateral administrator's positions workbook by SFTP and the pricing service's file by API.
larkspur:
  name: Larkspur CLO 2026-1 Warehouse
  borrower: Larkspur CLO 2026-1 Warehouse Ltd
  manager: Larkspur Credit Management LLC
  administrator: Halden Trust Company N.A.
  pricing_service: Meridian Loan Pricing
  lender: Thornbury Bank N.A.
  type: CLO warehouse facility
  signed: 2026-02-10
  commitment_usd: 400000000
  drawn_usd: 290000000
  advance_rate_pct: 70
  ccc_limit_pct: 7.5
  price_move_alert_pts: 10
  positions: 60
  april_date: 2026-04-30
  may_date: 2026-05-29
  # Positions with set ratings and prices. Every other position is generated from the seed.
  # [issuer, Moody's, S&P, par, April bid, May bid]
  ccc_in_april:
    - [Muker Telecom, Caa1, CCC+, 8000000, 84.00, 83.75]
    - [Embsay Fitness, Caa2, CCC, 7000000, 72.50, 71.25]
    - [Stainforth Specialty Retail, Caa1, B-, 9000000, 86.25, 86.00]
    # CCC under the lower-of rule only: S&P rates it CCC+.
    - [Gunnerside Media, B3, CCC+, 7000000, 87.75, 88.00]
  planted:
    # M11: downgraded in May; the CCC bucket goes over its limit and the excess is haircut.
    downgrade: {issuer: Kettlewell Auto Parts, par: 7500000, april: [B3, B-], may: [Caa2, CCC], bid: [88.00, 79.50]}
    # M12: the price falls more than 10 points in the month with no rating change.
    price_drop: {issuer: Denholme Chemicals, par: 8500000, rating: [B2, B], bid: [96.25, 81.50]}
    # N5: the agent consolidated an incremental term loan into this tranche, so it has new
    # identifiers. Issuer, facility, maturity and spread are unchanged.
    identifier_change: {issuer: Langdale Education, par: 9500000, old: [LX301245, 51475HAB3], new: [LX318806, 51475HAD9]}
    # No S&P rating: a reference-data warning, not an error.
    not_rated: Wensley Security Services
    sold: Hawes Hotels
    bought: [[Oxenhope Pet Care, 7000000, 99.25], [Reeth Payments, 7000000, 99.50]]
  received:
    positions_april: 2026-05-12
    prices_april: 2026-04-30
    positions_may: 2026-06-12
    prices_may: 2026-05-29

# Larkspur's daily feeds through May: positions from the collateral administrator by SFTP, bid
# prices and rating changes by API. The month-end files above are the 29 May deliveries.
larkspur_daily:
  seed: 20260529
  ratings_vendor: Ingleby Ratings Data
  # Business days of May whose feeds were delivered late or not at all.
  planted:
    # N8: the 14 May position file came the next morning, after the 07:00 deadline. Complete.
    late: {feed: positions, as_of: 2026-05-14, received: "2026-05-15T10:42"}
    # M20: no price file for 21 May: the pricing interface failed and nothing was resent.
    gap: {feed: prices, as_of: 2026-05-21}
  downgrade_day: 2026-05-19
  price_drop_day: 2026-05-12
  identifier_change_day: 2026-05-15

# Calderwood Bank's back-leverage facility to a direct lending fund: a middle-market book of 40
# obligor loans. Each obligor reports quarterly financial statements and a compliance certificate
# in its own layout; the fund sends a monthly portfolio report and borrowing base certificate.
# Amounts for obligors are in US$ thousands.
ravenglass:
  seed: 20260515
  name: Ravenglass Direct Lending Fund I back-leverage facility
  short_name: Ravenglass Direct Lending Fund I
  fund: Ravenglass Direct Lending Fund I LP
  borrower: Ravenglass DL Funding I LLC
  manager: Ravenglass Capital Management LLP
  address: 30 Lowther Street, Carlisle CA3 8DA, United Kingdom
  type: Back-leverage facility
  signed: 2025-11-14
  commitment_usd: 200000000
  drawn_usd: 138000000
  quarter_end: 2026-03-31
  as_of: 2026-05-31
  financials_due: 2026-05-15
  obligors: 40
  advance_rates: {First lien: 65, Unitranche: 55, Second lien: 30}
  single_obligor_limit_pct: 7.5
  sector_limit_pct: 20
  addback_cap_pct: 20
  leverage_tolerance_x: 0.02
  sectors: [Healthcare services, Software, Business services, Industrials, Consumer services,
            Specialty chemicals, Education, Food and beverage, Insurance services, Logistics,
            Building products, Financial technology]
  sponsors: [Brantwood Partners, Hawkshead Equity, Eskmeals Capital, Muncaster Partners,
             Seascale Growth Equity, Irton Capital, Gosforth Private Equity, Wasdale Partners]
  prefixes: [Arlecdon, Beckermet, Bootle, Calderbridge, Cleator, Distington, Egremont, Frizington,
             Gosforth, Haile, Ireby, Keekle, Lamplugh, Moresby, Nethertown, Ponsonby, Rottington,
             Sellafield, Thornhill, Ulpha, Waberthwaite, Whicham, Wythop, Asby, Braystones,
             Corney, Drigg, Embleton, Gilgarran, Holmrook, Irton, Kirksanton, Lowca, Millom, Brigham, Dearham, Gilcrux]
  received: {portfolio_report: 2026-06-10, borrowing_base_certificate: 2026-06-10}
  planted:
    # M13: leverage over its covenant: a Material Obligor Event, so the loan leaves the base.
    breach: {name: Hexby Precision Engineering, sector: Industrials, facility: Unitranche,
             outstanding: 9800000, ebitda: 8000, net_debt: 51440, interest: 3720,
             max_leverage: 6.00, min_icr: 2.00}
    # M14: add-backs of 34% of EBITDA. Whether the integration costs fall under the 20% cap on
    # cost savings, synergies and restructuring decides whether leverage breaches.
    addbacks: {name: Calloway Veterinary Partners, sector: Healthcare services,
               facility: Unitranche, outstanding: 11200000, ebitda: 10000, net_debt: 76380,
               interest: 5100, max_leverage: 6.00, min_icr: 2.00,
               items: [["Run-rate cost synergies from the Brookfold acquisition", 1900, capped],
                       ["Integration costs of the Brookfold acquisition", 900, judgement],
                       ["Non-recurring legal settlement", 600, uncapped]]}
    # M15: Q1 financials not delivered; the loan is excluded until they arrive.
    missing: {name: Ashlar Packaging Group, sector: Industrials, facility: First lien,
              outstanding: 7400000, ebitda: 9200, net_debt: 36340, interest: 2950,
              max_leverage: 5.25, min_icr: 2.25, last_quarter: 2025-12-31}
    # M16: a waiver raises the leverage covenant for the Q1 and Q2 test dates.
    waiver: {name: Kelsall Dental Partners, sector: Healthcare services, facility: First lien,
             outstanding: 8600000, ebitda: 8000, net_debt: 47360, interest: 3180,
             max_leverage: 5.50, amended: 6.25, min_icr: 2.00, signed: 2026-05-18,
             received: 2026-05-20, test_dates: [2026-03-31, 2026-06-30]}
    # N6: the fund's report truncates leverage; recomputed it rounds 0.01x higher. Logged.
    rounding: {name: Pendle Software Group, sector: Software, facility: First lien,
               outstanding: 6900000, ebitda: 8000, net_debt: 38700, interest: 2860,
               max_leverage: 6.00, min_icr: 2.00, reported: 4.83}

