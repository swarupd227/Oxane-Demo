  as_of: 2026-05-15
  seed: 20260515
  stages: [Intake, Interpretation, Clarification, QC, Live]
  # Per deal type: documents in a complete pack, terms and rules to configure, and the
  # first tape's size and average balance (fund finance counts investor commitments).
