services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: oxane
      POSTGRES_USER: oxane
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oxane_dev}
    ports:
      - "127.0.0.1:${DB_PORT:-5546}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oxane -d oxane"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Builds the deal pack on a fresh checkout, so `docker compose up` is all anyone needs.
  pack:
    build: ./deal-kit
    command: sh -c "test -f output/pack/Bramble_Credit_Agreement_Executed.pdf || python -m dealkit.build"
    volumes:
      - ./deal-kit:/deal-kit

  api:
    build: ./services/api
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      DATABASE_URL: postgresql+psycopg://oxane:${POSTGRES_PASSWORD:-oxane_dev}@db:5432/oxane
      DEAL_FILE: /deal-kit/deal.yaml
      LLM_MODE: ${LLM_MODE:-replay}
      PYTHONPATH: /packages/engine
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_FOUNDRY_API_KEY: ${ANTHROPIC_FOUNDRY_API_KEY:-}
      ANTHROPIC_FOUNDRY_RESOURCE: ${ANTHROPIC_FOUNDRY_RESOURCE:-}
    ports:
      - "127.0.0.1:${API_PORT:-8010}:8000"
    volumes:
      - ./services/api:/app
      - ./deal-kit:/deal-kit:ro
      - ./packages/engine:/packages/engine:ro
      - ./fixtures:/fixtures
    depends_on:
      db:
        condition: service_healthy
      pack:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build: ./apps/web
    environment:
      API_TARGET: http://api:8000
      # File change events do not reach the container from a Windows host.
      VITE_USE_POLLING: "true"
    ports:
      - "127.0.0.1:${WEB_PORT:-5180}:5173"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    depends_on:
      api:
        condition: service_healthy

  deal-kit:
    profiles: [tools]
    build: ./deal-kit
    volumes:
      - ./deal-kit:/deal-kit

  e2e:
    profiles: [tools]
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    working_dir: /e2e
    environment:
      BASE_URL: http://web:5173
    volumes:
      - ./tests/e2e:/e2e
      - /e2e/node_modules
    depends_on:
      - web

  engine:
    profiles: [tools]
    build: ./packages/engine
    volumes:
      - ./packages/engine:/engine
      - ./deal-kit:/deal-kit:ro

volumes:
  db-data:
