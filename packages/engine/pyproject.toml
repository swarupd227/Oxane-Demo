[project]
name = "oxane-engine"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["pydantic>=2.9"]

[project.optional-dependencies]
dev = ["openpyxl>=3.1", "pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["engine"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
